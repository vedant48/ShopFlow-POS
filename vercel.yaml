# Vercel Configuration for ShopFlow
# Framework: Vite (React + TypeScript + PWA)
# Backend: Cloudflare Workers + D1 Database

framework: vite
buildCommand: npm run build
outputDirectory: dist

# Environment variables for build & runtime
env:
  VITE_API_URL: "https://shopflow-worker.vedant-753.workers.dev"

# Route Rewrites:
# 1. Forward /api/* requests directly to Cloudflare Worker (avoids CORS issues)
# 2. Forward all other routes to index.html for SPA navigation
rewrites:
  - source: "/api/(.*)"
    destination: "https://shopflow-worker.vedant-753.workers.dev/api/$1"
  - source: "/(.*)"
    destination: "/index.html"

# Headers for optimal PWA caching
headers:
  - source: "/sw.js"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=0, must-revalidate"
  - source: "/workbox-(.*).js"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"
  - source: "/manifest.webmanifest"
    headers:
      - key: "Content-Type"
        value: "application/manifest+json"
      - key: "Cache-Control"
        value: "public, max-age=0, must-revalidate"
